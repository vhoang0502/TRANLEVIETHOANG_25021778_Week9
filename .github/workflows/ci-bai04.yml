name: CI/CD Bai 04 (Matrix Strategy)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Bai04/**'
      - '.github/workflows/ci-bai04.yml'

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      # fail-fast: false giúp cho nếu 1 OS lỗi, các OS khác vẫn tiếp tục chạy cho xong
      fail-fast: false

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./Bai04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test tren he dieu hanh ${{ matrix.os }}
        run: mvn -B clean test