name: CI/CD Pipeline

# Kích hoạt khi có push hoặc pull request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kéo mã nguồn về (Checkout code)
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Chạy vòng đời Maven (Test & Package)
        run: mvn -B clean test package

      - name: Lưu trữ tệp .jar (Upload Artifact)
        # Chỉ upload nếu bước build maven ở trên thành công
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathutils-app-jar
          path: target/*.jar